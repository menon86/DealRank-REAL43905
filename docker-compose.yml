services:
  db:
    image: postgres:16
    container_name: dealrank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealrank
      POSTGRES_PASSWORD: dealrank
      POSTGRES_DB: dealrank
    ports:
      - "5432:5432"
    volumes:
      - dealrank-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealrank -d dealrank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealrank-pgdata:
