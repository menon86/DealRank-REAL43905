# Render Blueprint. See docs/build-plan.md 7.3 and the README's "Deploy to
# Render" step. In the Render dashboard: New + -> Blueprint -> point at
# this repo. Provisions the API, the static frontend, and a managed
# Postgres instance from this one file.
#
# fromService cross-references below (CORS_ORIGINS, VITE_API_BASE_URL)
# resolve to each service's Render-assigned hostname, which does NOT
# include the "https://" scheme — Render's blueprint spec doesn't support
# string concatenation in envVars, so both are written with the scheme
# prepended by hand below assuming the default onrender.com domain. If
# either service is renamed, or a custom domain is attached, re-check
# these two values in the dashboard after the first deploy (the README's
# "Deploy to Render" step says this too).

databases:
  - name: dealrank-db
    databaseName: dealrank
    user: dealrank
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: dealrank-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    # Migrations run on every deploy, per docs/build-plan.md 7.3, before
    # the server starts serving traffic.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # The repo's .python-version (3.11) lives at the repo root, not
      # under rootDir: backend, so Render wouldn't see it there — pin
      # explicitly instead (pyproject.toml requires >=3.11,<3.13).
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: dealrank-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: DealRank
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://dealrank-frontend.onrender.com

  - type: web
    name: dealrank-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dealrank-api.onrender.com
    routes:
      # SPA fallback — client-side tab state (Shell.tsx) isn't
      # route-based, but this keeps a hard refresh or a direct link
      # working if that ever changes.
      - type: rewrite
        source: /*
        destination: /index.html
